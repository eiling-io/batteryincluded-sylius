imports:
    - { resource: "@EilingIoSyliusBatteryIncludedPlugin/config/config.yaml" }
    - { resource: "services_test.php" }
    - { resource: "cms.php" }

eiling_io_sylius_battery_included:
    channels:
        FASHION_WEB: default

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\EilingIo\SyliusBatteryIncludedPlugin

when@test:
    # own image directory: loading the fixtures purges it, the images of the dev shop have to stay
    parameters:
        sylius_core.images_dir: '%sylius_core.public_dir%/media/image-test'

    # the tests run without frontend build
    webpack_encore:
        strict_mode: false

    # the api is mocked, no credentials needed
    batteryincluded:
        http_client: eiling_io_sylius_battery_included.test.http_client

    services:
        eiling_io_sylius_battery_included.test.http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            arguments: ['@Tests\EilingIo\SyliusBatteryIncludedPlugin\Functional\MockApi']

        Tests\EilingIo\SyliusBatteryIncludedPlugin\Functional\MockApi: ~
